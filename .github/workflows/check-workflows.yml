# Fails when a workflow runs outside code that isn't pinned: an action not at a full commit SHA, a
# container image without an @sha256 digest, or a download piped into a shell. See
# scripts/check-workflows.ts. Dependabot moves the action pins (.github/dependabot.yml).
name: Check workflows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - run: node scripts/check-workflows.ts
